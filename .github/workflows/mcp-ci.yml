name: MCP Service CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'MCP/**'
      - 'requirements.txt'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'MCP/**'
      - 'requirements.txt'
      - 'pyproject.toml'

jobs:
  mcp-ci:
    name: MCP Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install MCP Dependencies
        run: |
          cd MCP
          pip install -r requirements.txt

      - name: Run MCP Linting
        run: |
          cd MCP
          pip install flake8 || echo "Flake8 not installed"
          flake8 . --max-line-length=88 --extend-ignore=E203,W503 || echo "Linting completed with warnings"

      - name: Run MCP Tests
        run: |
          cd MCP
          pip install pytest pytest-asyncio
          python -m pytest tests/ -v || echo "No tests found or tests failed"

      - name: Start MCP Server (for basic health check)
        run: |
          cd MCP
          python main.py &
          SERVER_PID=$!
          sleep 10
          curl -s http://localhost:8000/health || echo "Health check endpoint not available"
          kill $SERVER_PID || echo "Server already stopped"

      - name: Upload MCP Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-package
          path: MCP/