name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'

jobs:
  frontend-ci:
    name: Frontend (React/Vite) CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

      - name: Run Frontend Linting
        run: |
          cd Frontend
          npm run lint --if-present || echo "Linting script not found, skipping..."

      - name: Run Frontend Tests
        run: |
          cd Frontend
          npm test --if-present || echo "Test script not found, skipping..."

      - name: Build Frontend for Production
        run: |
          cd Frontend
          npm run build --if-present || echo "Build script not found, trying Vite build..."
          npm run build --if-present || vite build

      - name: Upload Frontend Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Frontend/dist